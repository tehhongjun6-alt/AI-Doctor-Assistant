[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medora-rag"
version = "0.1.0"
description = "MOH CPG RAG Pipeline for Medora"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.25.0",
    "google-genai>=1.0.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["medora_rag*"]
